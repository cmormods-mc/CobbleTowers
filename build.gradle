plugins {
    id 'fabric-loom' version '1.13.6'
}

// `-Pdev` builds the test jar: the Test Tower, the test commands and the client screenshot/remote tooling are in it, and
// the name ends in -dev. The default build is the release and leaves them out.
def devBuild = project.hasProperty('dev')
// `-Pserveronly` builds the server jar of the P43 goal: no client classes and a mod file that says "server", so it can sit on a
// server that players join with Cobblemon and WebGUI alone. The default build still carries the native client screens.
def serverOnly = project.hasProperty('serveronly')
version = '0.28.1-p47-badge-pin'
if (devBuild) version = version + '-dev'
if (serverOnly) version = version + '-server'
group = 'com.cobbletowers'

base {
    archivesName = 'CobbleTowers'
}

loom {
    accessWidenerPath = file('src/main/resources/cobbletowers.accesswidener')
    // First client-only code this mod has (P11): a spectator HUD and a reward reveal screen. Every
    // phase before this was server-authoritative logic with no client presentation at all, so there
    // was nothing for a split source set to separate out until now.
    splitEnvironmentSourceSets()

    // Without this, `client`'s compiled output never reaches the packaged jar -- splitting the source
    // set only separates the compile units, it does not bundle them back together on its own.
    mods {
        register('cobbletowers') {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // CobbleRaids, from `gradlew publishToMavenLocal` in SnobblemonRaids. Restricted to its group so
    // nothing else is ever resolved from a developer's local repository by accident.
    exclusiveContent {
        forRepository { mavenLocal() }
        filter { includeGroup 'com.cobbleraids' }
    }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.nucleoid.xyz/' }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()

    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
    modImplementation 'maven.modrinth:MdwFAVRL:gBW3vLC7' // Cobblemon 1.8.1

    // Server-only items (P43): the server runs the bundled Polymer; clients need none of it.
    modCompileOnly 'eu.pb4:polymer-core:0.9.19+1.21.1'
    modCompileOnly 'eu.pb4:polymer-resource-pack:0.9.19+1.21.1'
    modCompileOnly 'eu.pb4:polymer-reg-sync-manipulator:0.9.19+1.21.1'

    // Compile-only and non-transitive: CobbleRaids is installed on the server as its own mod, and its
    // own dependencies (SkiesGUIs, Placeholder API) are its business, not ours. Only the public API
    // package may be used; validation/validate_architecture.py enforces that on the bytecode.
    modCompileOnly("com.cobbleraids:cobbleraids:${cobbleraids_version}") { transitive = false }

    // Placeholder API is optional at run time (CobbleTowers registers its placeholders only when it is installed), so it is compile-only and
    // non-transitive, and nothing outside season.PlaceholderBridge may touch it.
    modCompileOnly('maven.modrinth:placeholder-api:2.4.2+1.21') { transitive = false }

    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

// Sources contain a few non-ASCII glyphs (the armor tooltip symbols), so say so rather than lean on the platform default.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

// Test-only code and data, left out of a release: see Dev.java.
def devOnlyClasses = ['com/cobbletowers/dev/**', 'com/cobbletowers/client/ClientDevTools*', 'com/cobbletowers/client/ScreenshotHarness*',
        'com/cobbletowers/client/ClientRemote*', 'com/cobbletowers/client/FeatureScreenSamples*', 'com/cobbletowers/client/FrameSampler*']
def devOnlyData = ['data/cobbletowers/cobbletowers/towers/test.json', 'data/cobbletowers/cobbletowers/floors/test/**',
        'data/cobbletowers/structure/poke_tower.nbt']

tasks.named('jar') {
    if (!devBuild) exclude devOnlyClasses
    if (serverOnly) exclude 'com/cobbletowers/client/**'
}

processResources {
    if (!devBuild) exclude devOnlyData
    // Read at configuration time: touching `project` inside filesMatching runs during execution,
    // which Gradle deprecates and the configuration cache forbids.
    def modVersion = project.version
    inputs.property 'version', modVersion
    def modEnvironment = serverOnly ? 'server' : '*'
    def clientEntrypoint = serverOnly ? '' : ', "client": ["com.cobbletowers.client.CobbleTowersClient"]'
    inputs.property 'environment', modEnvironment
    filesMatching('fabric.mod.json') {
        expand version: modVersion, environment: modEnvironment, clientEntrypoint: clientEntrypoint
    }
}
