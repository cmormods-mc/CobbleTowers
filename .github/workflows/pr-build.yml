name: CobbleTowers Pull Request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # CobbleTowers compiles against CobbleRaids from Maven Local. main must be at the version named
      # by cobbleraids_version in gradle.properties, or dependency resolution fails.
      - name: Checkout CobbleRaids
        uses: actions/checkout@v4
        with:
          repository: cmormods-mc/SnobblemonRaids
          path: .cobbleraids

      - name: Publish CobbleRaids to Maven Local
        working-directory: .cobbleraids
        run: gradle --no-daemon publishToMavenLocal --stacktrace

      - name: Validate the bundled tower definitions
        run: python3 validation/validate_definitions.py

      - name: Compile and test
        run: gradle --no-daemon clean build --stacktrace --warning-mode all

      # After the build on purpose: the check reads compiled bytecode.
      - name: Validate architecture and API boundaries
        run: |
          python3 validation/validate_architecture.py
          python3 validation/validate_api_boundary.py
          version=$(sed -n "s/^version = '\(.*\)'$/\1/p" build.gradle)
          python3 validation/validate_architecture.py "build/libs/CobbleTowers-${version}.jar"
          python3 validation/validate_api_boundary.py "build/libs/CobbleTowers-${version}.jar"
