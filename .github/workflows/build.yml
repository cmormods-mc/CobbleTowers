name: CobbleTowers CI

on:
  push:
    branches:
      - main
      - phase-0-architecture
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CobbleTowers
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Validate architecture boundary
        run: python3 validation/validate_architecture.py

      - name: Compile and test CobbleTowers
        run: gradle --no-daemon clean build --stacktrace --warning-mode all

      - name: Upload CobbleTowers outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobbletowers-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn

  upstream-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout CobbleTowers
        uses: actions/checkout@v4

      - name: Checkout audited CobbleRaids integration branch
        uses: actions/checkout@v4
        with:
          repository: cmormods-mc/SnobblemonRaids
          ref: feature/tower-integration-api
          path: upstream/SnobblemonRaids

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Validate CobbleRaids public integration boundary
        working-directory: upstream/SnobblemonRaids
        run: python3 validation/validate_tower_integration_api.py

      - name: Build exact CobbleRaids integration artifact
        working-directory: upstream/SnobblemonRaids
        run: gradle --no-daemon clean build --stacktrace --warning-mode all

      - name: Resolve exact CobbleRaids runtime JAR
        id: upstream_jar
        shell: bash
        run: |
          jar=$(find upstream/SnobblemonRaids/build/libs -maxdepth 1 -type f -name 'CobbleRaids-*.jar' ! -name '*sources*' ! -name '*dev*' | sort | head -n 1)
          if [ -z "$jar" ]; then
            echo "No remapped CobbleRaids runtime JAR was produced."
            ls -la upstream/SnobblemonRaids/build/libs || true
            exit 1
          fi
          echo "jar=$PWD/$jar" >> "$GITHUB_OUTPUT"
          echo "Using upstream artifact: $jar"

      - name: Validate CobbleTowers architecture boundary
        run: python3 validation/validate_architecture.py

      - name: Compile CobbleTowers against exact CobbleRaids build
        run: gradle --no-daemon -Pcobbleraids_jar="${{ steps.upstream_jar.outputs.jar }}" clean build --stacktrace --warning-mode all

      - name: Upload integration outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobbletowers-upstream-compatibility
          path: |
            build/libs/*.jar
            build/reports/**
            upstream/SnobblemonRaids/build/libs/*.jar
            upstream/SnobblemonRaids/build/reports/**
          if-no-files-found: warn
