// Prints the main source set's runtime classpath (Minecraft's libraries, Fabric Loader, and the development-only entries that
// pedestal_shots.py filters out). Used as an init script: gradlew -q -I validation/print_main_classpath.gradle printClientLibs
allprojects {
    afterEvaluate { project ->
        if (project.extensions.findByName('sourceSets') != null && project.sourceSets.findByName('main') != null) {
            project.tasks.register('printClientLibs') {
                doLast {
                    println 'CLIENTLIBS=' + project.sourceSets.main.runtimeClasspath.files.join(';')
                }
            }
        }
    }
}
